<!DOCTYPE html>
<html>
<head>
<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#e5e5e5;
  font-family:Arial;
}

/* CARD */
.box{
  background:#f1f1f1;
  padding:60px;
  border-radius:20px;
  width:320px;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

h3{
  margin-bottom:20px;
}

/* INPUT */
input{
  width:100%;
  padding:14px;
  margin:10px 0;
  border:1px solid #ccc;
  border-radius:10px;
  background:#fff;
  font-size:14px;
}

/* BUTTON */
button{
  width:100%;
  padding:14px;
  background:#ff385c;
  color:white;
  border:none;
  border-radius:10px;
  font-size:16px;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  background:#e03150;
}
</style>
</head>

<body>

<div class="box">
  <h3>Payment</h3>
  <input placeholder="Card Number">
  <input placeholder="Expiry">
  <input placeholder="CVV">
  <button onclick="pay()">Pay Now</button>
</div>

<script>
function pay(){
  alert("Payment Successful 🎉");
  window.location.href="index.html";
}
</script>

</body>
</html>
