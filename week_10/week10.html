<!DOCTYPE html>
<html>
<head>
    <title>Logic Programs</title>
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            display: flex;
            height: 100vh;
            background: #121212;
            color: #fff;
        }

        .left {
            width: 30%;
            background: #1e1e1e;
            padding: 25px;
            border-right: 1px solid #333;
            box-shadow: inset -5px 0 10px rgba(0,0,0,0.4);
        }

        .right {
            width: 70%;
            background: #181818;
            padding: 30px;
        }

        h3 {
            margin-top: 0;
            font-weight: 500;
            color: #e0e0e0;
        }

        input {
            width: 95%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: white;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #888;
            box-shadow: 0 0 6px rgba(255,255,255,0.1);
        }

        button {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #3a3a3a, #2a2a2a);
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            background: #444;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        #output {
            background: #222;
            padding: 25px;
            border-radius: 10px;
            min-height: 220px;
            white-space: pre-line;
            border: 1px solid #333;
            font-size: 15px;
            color: #e6e6e6;
        }
    </style>
</head>

<body>

<div class="left">
    <h3>Input Panel</h3>
    <input type="text" id="numbers" placeholder="Enter values (e.g. 1,2,3)">
    
    <button onclick="signProduct()">Sign of Product</button>
    <button onclick="sortNumbers()">Sort Numbers</button>
    <button onclick="largestNumber()">Largest Number</button>
    <button onclick="oddEvenLoop()">Odd / Even</button>
    <button onclick="studentGrade()">Student Grade</button>
</div>

<div class="right">
    <h3>Output Console</h3>
    <div id="output">Result will appear here</div>
</div>

<script>
function getNumbers() {
    let input = document.getElementById("numbers").value;
    return input.split(",").map(Number);
}

function signProduct() {
    let input = document.getElementById("numbers").value;
    if (input === "") {
        document.getElementById("output").textContent =
        "Enter 3 numbers like: 0,-1,4";
        return;
    }
    let nums = getNumbers();
    let negative = 0;
    for (let n of nums) {
        if (n < 0) negative++;
    }
    let result = (negative % 2 == 0) ? "+1" : "-1";
    alert(result);
    document.getElementById("output").textContent = "Sign: " + result;
}

function sortNumbers() {
    let input = document.getElementById("numbers").value;
    if (input === "") {
        document.getElementById("output").textContent =
        "Enter 3 numbers like: 0,-1,4";
        return;
    }
    let nums = getNumbers();
    nums.sort((a, b) => b - a);
    alert(nums.join(", "));
    document.getElementById("output").textContent =
    "Sorted: " + nums.join(", ");
}

function largestNumber() {
    let input = document.getElementById("numbers").value;
    if (input === "") {
        document.getElementById("output").textContent =
        "Enter 5 numbers like: -5,-2,-6,0,-1";
        return;
    }
    let nums = getNumbers();
    let max = nums[0];
    for (let n of nums) {
        if (n > max) max = n;
    }
    alert("Largest: " + max);
    document.getElementById("output").textContent =
    "Largest: " + max;
}

function oddEvenLoop() {
    let input = document.getElementById("numbers").value;
    if (input === "") {
        document.getElementById("output").textContent =
        "Enter a number like: 15";
        return;
    }
    let n = Number(input);
    let result = "";
    for (let i = 0; i <= n; i++) {
        if (i % 2 == 0)
            result += i + " is Even\n";
        else
            result += i + " is Odd\n";
    }

    document.getElementById("output").textContent = result;
}

function studentGrade() {
    let input = document.getElementById("numbers").value;
    if (input === "") {
        document.getElementById("output").textContent =
        "Enter marks like: 70,80,90,60,75,85";
        return;
    }
    let nums = getNumbers();
    let sum = 0;
    for (let n of nums) sum += n;
    let avg = sum / nums.length;
    let grade;

    if (avg >= 90) grade = "A";
    else if (avg >= 75) grade = "B";
    else if (avg >= 60) grade = "C";
    else grade = "D";

    alert("Average: " + avg + " Grade: " + grade);
    document.getElementById("output").textContent =
    "Average: " + avg + " | Grade: " + grade;
}
</script>

</body>
</html>
