<!DOCTYPE html>
<html>
<head>
    <title>Logic Programs</title>
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #2c2c2c, #3a3a3a);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            padding: 40px;
            width: 380px;
            text-align: center;
        }

        h2 {
            margin-bottom: 25px;
            color: #222;
            font-weight: 600;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1.5px solid #ccc;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #888;
            box-shadow: 0 0 8px rgba(0,0,0,0.1);
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        button {
            padding: 12px;
            font-size: 14px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            color: #fff;
            font-weight: 500;
            background: linear-gradient(135deg, #5a5a5a, #2f2f2f);
            transition: all 0.25s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        }

        .output {
            background: #f5f5f5;
            padding: 18px;
            border-radius: 10px;
            min-height: 60px;
            color: #333;
            font-size: 16px;
            border: 1px solid #ddd;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Logic Programs</h2>

    <input type="number" id="numInput" placeholder="Enter a number" />

    <div class="buttons">
        <button onclick="checkEvenOdd()">Even / Odd</button>
        <button onclick="checkPrime()">Prime / Not</button>
        <button onclick="calcFactorial()">Factorial</button>
        <button onclick="checkArmstrong()">Armstrong</button>
    </div>

    <div class="output" id="output">Result will appear here</div>
</div>

<script>
function getInput() {
    const val = document.getElementById('numInput').value.trim();
    if (val === '' || isNaN(val)) {
        document.getElementById('output').textContent = 'Please enter a valid number.';
        return null;
    }
    return parseInt(val);
}

function setOutput(text) {
    document.getElementById('output').textContent = text;
}

function checkEvenOdd() {
    const n = getInput();
    if (n === null) return;
    setOutput(n + ' is ' + (n % 2 === 0 ? 'Even' : 'Odd'));
}

function checkPrime() {
    const n = getInput();
    if (n === null) return;
    if (n < 2) { setOutput(n + ' is Not Prime'); return; }
    for (let i = 2; i <= Math.sqrt(n); i++) {
        if (n % i === 0) {
            setOutput(n + ' is Not Prime');
            return;
        }
    }
    setOutput(n + ' is Prime');
}

function calcFactorial() {
    const n = getInput();
    if (n === null) return;
    if (n < 0) {
        setOutput('Factorial not defined for negative numbers');
        return;
    }
    let result = 1;
    for (let i = 2; i <= n; i++) result *= i;
    setOutput(n + '! = ' + result);
}

function checkArmstrong() {
    const n = getInput();
    if (n === null) return;
    const digits = String(n).split('');
    const power = digits.length;
    const sum = digits.reduce((acc, d) => acc + Math.pow(Number(d), power), 0);
    setOutput(n + (sum === n ? ' is an Armstrong number' : ' is Not an Armstrong number'));
}
</script>

</body>
</html>
