<!DOCTYPE html>
<html>
<head>
    <title>Two Forms Using Iframes</title>
</head>
<body>
    <p>Name:SUJANKR7 Rollno:227</p>

    <center>
        <h2>Two Forms Using Iframes</h2>

        <!-- Login Form Iframe -->
        <iframe width="600" height="500"
            srcdoc='
            <!DOCTYPE html>
            <html>
            <head>
                <title>User Login</title>
            </head>
            <body>
                <center>
                    <h2>User Login</h2>
                    <form>
                        <table width="50" border="1" cellpadding="25" cellspacing="2" style="text-align:center;">

                            <tr>
                                <td>
                                    <label for="username">Username:</label>
                                </td>
                                <td>
                                    <input type="text" id="username" name="username">
                                </td>
                            </tr>

                            <tr>
                                <td>
                                    <label for="password">Password:</label>
                                </td>
                                <td>
                                    <input type="password" id="password" name="password">
                                </td>
                            </tr>

                            <tr>
                                <td colspan="2" style="text-align:center;">
                                    <input type="submit" value="Login">
                                </td>
                            </tr>

                        </table>
                    </form>
                </center>
            </body>
            </html>
            '>
        </iframe>

        <!-- Registration Form Iframe -->
        <iframe width="600" height="500"
            srcdoc='
            <!DOCTYPE html>
            <html>
            <head>
                <title>User Registration</title>
            </head>
            <body>
                <center>
                    <h2>User Registration</h2>
                    <form>
                        <table width="50" border="1" cellpadding="25" cellspacing="2" style="text-align:center;">

                            <tr>
                                <td>
                                    <label for="fullname">Full Name:</label>
                                </td>
                                <td>
                                    <input type="text" id="fullname" name="fullname">
                                </td>
                            </tr>

                            <tr>
                                <td>
                                    <label for="email">Email:</label>
                                </td>
                                <td>
                                    <input type="email" id="email" name="email">
                                </td>
                            </tr>

                            <tr>
                                <td>
                                    <label for="phone">Phone:</label>
                                </td>
                                <td>
                                    <input type="text" id="phone" name="phone">
                                </td>
                            </tr>

                            <tr>
                                <td>
                                    <label for="password">Password:</label>
                                </td>
                                <td>
                                    <input type="password" id="password" name="password">
                                </td>
                            </tr>

                            <tr>
                                <td colspan="2" style="text-align:center;">
                                    <input type="submit" value="Register">
                                    <input type="reset" value="Reset">
                                </td>
                            </tr>

                        </table>
                    </form>
                </center>
            </body>
            </html>
            '>
        </iframe>

    </center>

</body>
</html>
