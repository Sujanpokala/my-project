<!DOCTYPE html>
<html>
<head>
<title>My Ecommerce Store</title>

<style>

body{
font-family: Arial;
margin:0;
background:#f5f5f7;
}

.header{
background:#0f172a;
color:white;
text-align:center;
padding:20px;
font-size:28px;
}

.sale{
background:#2563eb;
color:white;
text-align:center;
padding:10px;
font-size:18px;
font-weight:bold;
}

.container{
display:flex;
}

.sidebar{
width:200px;
background:#1e293b;
color:white;
padding:20px;
}

.sidebar h3{
margin-top:0;
}

.sidebar ul{
list-style:none;
padding:0;
}

.sidebar li{
padding:8px 0;
cursor:pointer;
}

.products{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
padding:20px;
flex:1;
}

.product{
background:white;
border-radius:8px;
padding:15px;
text-align:center;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.product img{
width:100%;
height:360px;
object-fit:cover;
border-radius:6px;
margin-bottom:10px;
}

.product h4{
margin:5px 0;
color:#111827;
}

.price{
color:#16a34a;
font-weight:bold;
margin:5px 0;
}

button{
background:#2563eb;
color:white;
border:none;
padding:10px;
border-radius:5px;
cursor:pointer;
}
.card button:hover{ 
    background:black; 
}

.footer{
background:#0f172a;
color:white;
text-align:center;
padding:15px;
margin-top:20px;
}

</style>
</head>

<body>

<div class="header">
My Ecommerce Store
</div>

<div class="sale">
Big Sale! Up to 50% Off
</div>

<div class="container">

<div class="sidebar">
<h3>Categories</h3>
<ul>
<li>Electronics</li>
<li>Clothing</li>
<li>Home Appliances</li>
<li>Books</li>
</ul>
</div>

<div class="products">

<div class="product">
<img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9">
<h4>Smartphone</h4>
<p class="price">$499</p>
<button>Add to Cart</button>
</div>

<div class="product">
<img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab">
<h4>T-Shirt</h4>
<p class="price">$25</p>
<button>Add to Cart</button>
</div>

<div class="product">
<img src="https://images.unsplash.com/photo-1586201375761-83865001e31c">
<h4>Microwave</h4>
<p class="price">$150</p>
<button>Add to Cart</button>
</div>

<div class="product">
<img src="https://images.unsplash.com/photo-1512820790803-83ca734da794">
<h4>Programming Book</h4>
<p class="price">$30</p>
<button>Add to Cart</button>
</div>

</div>
</div>

<div class="footer">
© 2026 My Ecommerce Store
</div>

</body>
</html>
