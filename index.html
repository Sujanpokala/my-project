<!DOCTYPE html>

<title>StayFinder India</title>

<style>
body{margin:0;font-family:Arial;background:#f7f7f7}

/* NAV */
.nav{
  display:flex;
  justify-content:space-between;
  padding:15px;
  background:white;
  position:sticky;
  top:0;
}

.nav-right{display:flex;gap:15px}

/* SEARCH */
.search-wrapper{
  display:flex;
  justify-content:center;
  margin:30px 0;
}

.search-box{
  display:flex;
  align-items:center;
  gap:10px;
  padding:14px 20px;
  border-radius:50px;
  background:white;
  box-shadow:0 5px 20px rgba(0,0,0,0.15);
  width:70%;
  max-width:800px;
}

.search-box input{
  flex:1;
  border:none;
  outline:none;
  font-size:16px;
}

.search-box button{
  background:#ff385c;
  border:none;
  color:white;
  padding:10px 14px;
  border-radius:50%;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:20px;
  padding:20px;
}

.card{
  background:white;
  border-radius:12px;
  overflow:hidden;
  cursor:pointer;
  transition:0.3s;
}

.card:hover{transform:scale(1.03)}

.card img{
  width:100%;
  height:150px;
  object-fit:cover;
}

.card-content{padding:10px}
</style>
</head>

const finalData = data.map((d,i)=>({
  id:i+1,
  name:"Stay "+(i+1),
  city:d.city,
  price: Math.floor(Math.random()*8000)+2000,
  img:d.img
}));

function openPage(id){
  localStorage.setItem("selectedStay", id);
  localStorage.setItem("allData", JSON.stringify(finalData));
  location.href="details.html";
}

function display(list){
  grid.innerHTML="";
  list.forEach(item=>{
    grid.innerHTML+=`
    <div class="card" onclick="openPage(${item.id})">
      <img src="${item.img}">
      <div class="card-content">
        <h3>${item.name}</h3>
        <p>${item.city}</p>
        <p>₹${item.price}/night</p>
      </div>
    </div>`;
  });
}

search.oninput=e=>{
  let v=e.target.value.toLowerCase();
  display(finalData.filter(d=>d.city.toLowerCase().includes(v)));
};
